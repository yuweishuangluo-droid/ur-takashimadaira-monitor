name: UR高島平1LDK監視

on:
  schedule:
    # 5分ごとに自動実行
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-ur:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境の準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: UR空室チェック＆Discord通知を実行
        run: |
          python -c '
          import requests
          from bs4 import BeautifulSoup

          webhook_url = "https://discord.com/api/webhooks/1548194895590596708/QRVcS-S6RjWeaxWHqRy2MQhB6wZP_2HRHnMLgfK-PHJSqcvoed3Ah3ctSO0nPo274jqp"
          target_url = "https://www.ur-net.go.jp/chintai/kanto/tokyo/20_2250.html"

          headers = {
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
          }

          try:
              res = requests.get(target_url, headers=headers, timeout=15)
              res.raise_for_status()
              soup = BeautifulSoup(res.text, "html.parser")

              # ページ内のテキストを判定
              page_text = soup.get_text()

              # 空室情報エリアの簡易判定（1LDKが含まれるか）
              if "1LDK" in page_text:
                  print("ページ取得成功：1LDK関連の記述を検出しました。")
                  # 必要に応じて通知
                  # message = f"🚨 **【UR高島平】1LDKの空室情報を検知しました！**\n\n🔗 {target_url}"
                  # requests.post(webhook_url, json={"content": message})
              else:
                  print("ページ取得成功：現在、1LDKの掲載はありません。")

          except Exception as e:
              print(f"エラーが発生しました: {e}")
          '
