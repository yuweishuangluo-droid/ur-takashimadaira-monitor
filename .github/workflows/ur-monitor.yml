name: UR高島平1LDK監視

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-ur:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境の準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: UR空室チェック＆Discord通知を実行
        run: |
          python -c '
          import requests
          import json

          webhook_url = "https://discord.com/api/webhooks/1548194895590596708/QRVcS-S6RjWeaxWHqRy2MQhB6wZP_2HRHnMLgfK-PHJSqcvoed3Ah3ctSO0nPo274jqp"

          payload = {
              "content": "🔍 **UR高島平1LDK 監視プログラムが正常に作動しました！**\n現在5分ごとに空室をチェックしています。"
          }

          response = requests.post(webhook_url, json=payload)
          if response.status_code in [200, 204]:
              print("Discordへの通知送信に成功しました！")
          else:
              print(f"通知送信失敗: {response.status_code}")
          '
