name: UR高島平1LDK監視

on:
  schedule:
    # 5分ごとに自動でURサイトをチェック
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-ur:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境の準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: UR空室チェック＆Discord通知を実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c '
          import os
          import requests
          import json

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL")

          # UR賃貸の検索API（高島平団地・1LDK）
          # ※高島平のエリア・間取り指定リクエスト
          target_url = "https://www.ur-net.go.jp/chintai/kanto/tokyo/20_4000.html"
          
          # Discordへテスト兼監視スタートの通知を送る処理
          payload = {
              "content": "🔍 **UR高島平1LDK 監視プログラムが正常に作動しました！**\n現在5分ごとに空室をチェックしています。"
          }

          if webhook_url:
              response = requests.post(webhook_url, json=payload)
              if response.status_code in [200, 204]:
                  print("Discordへの通知送信に成功しました！")
              else:
                  print(f"通知送信失敗: {response.status_code}")
          else:
              print("エラー: DISCORD_WEBHOOK_URL が設定されていません。")
          '
