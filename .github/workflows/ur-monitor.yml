name: UR高島平1LDK監視

on:
  schedule:
    # 5分ごとに自動実行
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-ur:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境の準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: UR空室チェック＆Discord通知を実行
        run: |
          python -c '
          import requests
          import json

          webhook_url = "https://discord.com/api/webhooks/1548194895590596708/QRVcS-S6RjWeaxWHqRy2MQhB6wZP_2HRHnMLgfK-PHJSqcvoed3Ah3ctSO0nPo274jqp"

          # UR賃貸の関東（東京・高島平周辺）空室確認API/ページ
          # ※UR公式の検索リクエストエンドポイント
          ur_api_url = "https://www.ur-net.go.jp/chintai/kanto/tokyo/20_4000.html"
          
          headers = {
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
          }

          try:
              res = requests.get(ur_api_url, headers=headers, timeout=15)
              
              # 空室判定ロジック（高島平・1LDKの空き部屋検出）
              # ※ページ内に該当の部屋情報が存在するかチェック
              if "1LDK" in res.text and "高島平" in res.text:
                  message = f"🚨 **【UR高島平】1LDKの空室が見つかりました！**\n\n今すぐ確認してください！\n🔗 {ur_api_url}"
                  requests.post(webhook_url, json={"content": message})
                  print("空室を検知し、Discordに通知しました！")
              else:
                  print("現在、該当する空室はありません。")
          except Exception as e:
              print(f"エラーが発生しました: {e}")
          '
