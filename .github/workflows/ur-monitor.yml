name: UR高島平1LDK監視

on:
  schedule:
    # 5分ごとに自動実行
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-ur:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境の準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: UR空室チェック＆Discord通知を実行
        run: |
          python -c '
          import requests
          from bs4 import BeautifulSoup

          webhook_url = "https://discord.com/api/webhooks/1548194895590596708/QRVcS-S6RjWeaxWHqRy2MQhB6wZP_2HRHnMLgfK-PHJSqcvoed3Ah3ctSO0nPo274jqp"
          target_url = "https://www.ur-net.go.jp/chintai/kanto/tokyo/20_2250.html"

          headers = {
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
          }

          try:
              res = requests.get(target_url, headers=headers, timeout=15)
              res.raise_for_status()
              soup = BeautifulSoup(res.text, "html.parser")

              html_text = res.text
              has_1ldk = False

              # 「空室情報」セクションのみを抽出して誤検知（概要欄や近隣物件）を防止
              if "空室情報" in html_text:
                  vacant_section = html_text.split("空室情報")[1]

                  # 後続の不要なエリアをカット
                  for delimiter in ["お問い合わせはこちら", "近隣の部屋を見る", "周辺情報などをもっと知る"]:
                      if delimiter in vacant_section:
                          vacant_section = vacant_section.split(delimiter)[0]

                  # 「ご案内できるお部屋がございません」がなく、かつ「1LDK」が含まれている場合のみ判定
                  if "ご案内できるお部屋がございません" not in vacant_section and "1LDK" in vacant_section:
                      has_1ldk = True

              if has_1ldk:
                  message = f"🚨 **【UR高島平】1LDKの空室が出ました！**\n\n今すぐ確認・申し込みを行ってください！\n🔗 {target_url}"
                  requests.post(webhook_url, json={"content": message})
                  print("1LDKの空室を検知し、Discordに通知を送りました！")
              else:
                  print("現在「空室情報」エリアに1LDKの空き部屋はありません。")

          except Exception as e:
              print(f"エラーが発生しました: {e}")
          '
