name: UR高島平1LDK監視

on:
  schedule:
    # 5分ごとに自動実行
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests beautifulsoup4

      - name: UR空室チェック＆Discord通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c '
          import requests
          import json
          import os

          # ※ここへ実際のUR検索API/スクレイピング処理を組み込みます
          print("UR高島平の1LDK空室確認中...")
          '
